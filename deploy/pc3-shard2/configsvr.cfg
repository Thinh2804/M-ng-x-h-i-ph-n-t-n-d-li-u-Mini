# PC3 - Thành viên config server (cfgrs), cổng 27019: mongos vẫn chạy khi mất PC1
sharding:
  clusterRole: configsvr
replication:
  replSetName: cfgrs
net:
  port: 27019
  bindIp: 0.0.0.0
storage:
  dbPath: C:\data\configsvr
systemLog:
  destination: file
  path: C:\data\log\configsvr.log
  logAppend: true
