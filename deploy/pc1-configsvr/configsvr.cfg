# PC1 - Config Server (mongod --configsvr), cổng 27019
# Dùng với MongoDB Community Server cài native trên Windows
sharding:
  clusterRole: configsvr
replication:
  replSetName: cfgrs
net:
  port: 27019
  bindIp: 0.0.0.0
storage:
  dbPath: C:\data\configsvr
systemLog:
  destination: file
  path: C:\data\log\configsvr.log
  logAppend: true
