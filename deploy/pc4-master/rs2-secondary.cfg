# PC4 - Bản sao thứ 3 của rs2 (priority 0): rs2 vẫn còn đa số khi mất PC2 hoặc PC3, cổng 27039
sharding:
  clusterRole: shardsvr
replication:
  replSetName: rs2
net:
  port: 27039
  bindIp: 0.0.0.0
storage:
  dbPath: C:\data\rs2-secondary
systemLog:
  destination: file
  path: C:\data\log\rs2-secondary.log
  logAppend: true
