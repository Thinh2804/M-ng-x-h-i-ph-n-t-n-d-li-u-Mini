# PC4 - Bản sao thứ 3 của rs1 (priority 0): rs1 vẫn còn đa số khi mất PC2 hoặc PC3, cổng 27038
sharding:
  clusterRole: shardsvr
replication:
  replSetName: rs1
net:
  port: 27038
  bindIp: 0.0.0.0
storage:
  dbPath: C:\data\rs1-secondary
systemLog:
  destination: file
  path: C:\data\log\rs1-secondary.log
  logAppend: true
